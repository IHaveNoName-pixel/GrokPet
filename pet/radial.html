<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self';script-src 'self';img-src 'self' data:;"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="radial.css"><title>快捷控制</title></head><body><main id="radial" aria-label="环绕快捷控制"><svg class="connections" viewBox="0 0 760 650" aria-hidden="true"><circle cx="380" cy="325" r="90"/><path d="M380 325 200 155M380 325 560 155M380 325 145 325M380 325 615 325M380 325 200 495M380 325 560 495"/></svg><div class="hub surface"><span class="hub-mark" aria-hidden="true">✦</span><strong>快捷控制</strong><button id="close" aria-label="关闭快捷控制">×</button></div>
<section class="surface node wifi"><header><span class="icon" data-icon="wifi"></span><h2>Wi-Fi</h2><button data-settings="wifi" aria-label="打开 Wi-Fi 设置">↗</button></header><p id="wifi-state">读取无线状态…</p><button class="switch" role="switch" aria-checked="false" id="wifi-toggle" disabled><i></i><span>切换</span></button></section>
<section class="surface node bluetooth"><header><span class="icon" data-icon="bluetooth"></span><h2>蓝牙</h2><button data-settings="bluetooth" aria-label="打开蓝牙设置">↗</button></header><p id="bluetooth-state">读取设备状态…</p><button class="switch" role="switch" aria-checked="false" id="bluetooth-toggle" disabled><i></i><span>切换</span></button></section>
<section class="surface node volume"><header><span class="icon" data-icon="volume"></span><h2>主音量</h2><output id="volume-value">—</output></header><label class="sr-only" for="volume">主音量</label><input id="volume" type="range" min="0" max="100" disabled><p id="volume-state">读取当前音量…</p><button id="volume-undo" class="subtle">撤销音量</button></section>
<section class="surface node brightness"><header><span class="icon" data-icon="sun"></span><h2>亮度</h2><output id="brightness-value">—</output><button data-settings="brightness" aria-label="打开显示设置">↗</button></header><label class="sr-only" for="brightness">屏幕亮度</label><input id="brightness" type="range" min="0" max="100" disabled><p id="brightness-state">检测显示器…</p></section>
<section class="surface node apps"><header><span class="icon" data-icon="grid"></span><h2>我的快捷方式</h2><button id="configure" aria-label="配置快捷方式">＋</button></header><div id="launches"><p>读取已配置目标…</p></div></section>
<section class="surface node battery"><header><span class="icon" data-icon="battery"></span><h2>电池与电源</h2><button data-settings="battery" aria-label="打开电源设置">↗</button></header><strong id="battery-value">—</strong><progress id="battery-level" max="100" value="0" aria-label="电池电量" hidden></progress><p id="battery-state">读取电源状态…</p></section>
<aside id="feedback" class="surface" role="status" hidden></aside><button id="refresh" class="surface">刷新状态</button></main><script src="radial.js"></script></body></html>
