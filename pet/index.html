<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>软团 · 桌宠学习版</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <main id="stage" aria-label="桌宠">
    <div id="bubble" role="status" aria-live="polite">你好，摸摸我吧</div>
    <div id="shadow"></div>
    <div id="pet-hit" role="button" tabindex="0" aria-label="抚摸桌宠，右键打开设置" title="点击摸摸 · 拖动移动 · 右键设置">
      <svg id="character" aria-hidden="true"></svg>
    </div>
    <div id="hint">点击摸摸 · 拖动移动 · 右键设置</div>
    <div id="telemetry" aria-live="off"><span id="quota-line">Codex 连接中…</span><span id="network-line">等待网络指标…</span><span id="hardware-line">CPU — · 内存 — · GPU —</span></div>
  </main>
  <script src="../replica/geometry-data.js"></script>
  <script src="../replica/src/math.js"></script>
  <script src="../replica/src/tables.js"></script>
  <script src="../replica/src/pose.js"></script>
  <script src="../replica/src/tricks.js"></script>
  <script src="../replica/src/fx.js"></script>
  <script src="../replica/src/eyes.js"></script>
  <script src="../replica/src/character.js"></script>
  <script src="pet.js"></script>
</body>
</html>
