<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; media-src 'self' blob:; object-src 'none'; base-uri 'none'">
  <title>软团 · 桌宠学习版</title>
  <link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="cult.css"><link rel="stylesheet" href="pet.css">
<link rel="stylesheet" href="radial-embedded.css"><link rel="stylesheet" href="ui-controls.css"><link rel="stylesheet" href="arc-controls.css"></head>
<body>
  <main id="stage" aria-label="桌宠">
    <div id="bubble" role="status" aria-live="polite">你好，摸摸我吧</div>
    <div id="shadow"></div>
    <div id="music-notes" aria-hidden="true"><span>♪</span><span>♫</span></div>
    <div id="pet-hit" role="button" tabindex="0" aria-label="抚摸桌宠，双击或右键打开设置">
      <svg id="character" aria-hidden="true"></svg>
    </div>
    <div id="hint">点击摸摸 · 拖动移动 · 右键设置</div>
    <div id="info-dock"><div id="reminder-card" class="quick-card quick-card-row" hidden><button id="reminder-shortcut" type="button">查看提醒待办</button><button id="reminder-confirm" type="button" hidden>确定</button></div><section id="focus-card" class="quick-card"><div class="quick-card-row"><span id="focus-label">专注计时</span><button type="button" data-focus-quick="start">开始</button><button type="button" data-focus-quick="pause" hidden>暂停</button><button type="button" data-focus-quick="resume" hidden>继续</button><button type="button" data-focus-quick="stop" hidden>结束</button></div><div id="focus-timer" class="cult-timer" data-state="idle"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path class="timer-hand" d="M12 6v6l4 2"/></svg><output id="focus-clock" role="timer" aria-live="off" aria-label="剩余时间">25:00</output></div><details id="focus-details"><summary>场景与提醒设置</summary><div class="quick-card-settings"><label>当前场景<select id="quick-scene"><option value="focus">专注</option><option value="rest">休息</option><option value="water">喝水</option><option value="eyes">护眼</option><option value="reminder">提醒</option><option value="todo">待办</option></select></label><label>场景名称<input id="quick-scene-name" maxlength="40" required></label><label>执行方式<select id="quick-scene-kind"><option value="focus">专注计时与免打扰</option><option value="reminder">到期提醒</option><option value="todo">添加待办</option></select></label><label>提醒内容<input id="quick-scene-title" maxlength="100"></label><label>重复<select id="quick-scene-repeat"><option value="">不重复</option><option value="daily">每天</option><option value="weekly">每周</option></select></label><label>重要提醒<input id="quick-scene-important" type="checkbox"></label><label>时长（分钟）<input id="quick-focus-minutes" type="number" min="1" max="180"></label><label>计时动作<select id="quick-focus-visual"><option value="progress">进度环</option><option value="orbit">环绕轨道</option></select></label><button id="quick-focus-save" type="button">保存设置</button><button id="quick-scene-custom" type="button">另存为自定义场景</button><button id="quick-scene-delete" type="button" hidden>删除自定义场景</button><span id="quick-focus-feedback" role="status"></span></div></details></section>
<section id="load-card" class="quick-card"><details id="load-details"><summary>持续负载 <span id="quick-load-status"></span></summary><div class="quick-card-settings"><label>CPU %<input id="quick-load-cpu" type="number" min="20" max="100"></label><label>内存 %<input id="quick-load-memory" type="number" min="20" max="100"></label><label>GPU %<input id="quick-load-gpu" type="number" min="20" max="100"></label><label>持续秒数<input id="quick-load-seconds" type="number" min="2" max="120"></label><button id="quick-load-save" type="button">保存阈值</button><span id="quick-load-feedback" role="status"></span></div></details></section>
      <div id="music-controls" role="group" aria-label="网易云播放控制" hidden><div class="track"><span id="music-line" hidden></span><span id="music-artist"></span></div><button type="button" data-music="previous" title="上一首" aria-label="上一首">⏮</button><button type="button" data-music="toggle" id="music-toggle" title="播放" aria-label="播放">▶</button><button type="button" data-music="next" title="下一首" aria-label="下一首">⏭</button></div>
      <div id="transfer-indicator" hidden><span id="transfer-title"></span><progress id="transfer-progress" max="100" aria-label="下载或安装进度"></progress></div>
      <div id="dock-actions"><div id="cult-toolbar-host"></div>
      <form id="quick-form"><section id="chat-history" hidden aria-label="本次运行对话记录"><button type="button" id="chat-history-toggle" aria-expanded="true" aria-controls="chat-history-list">对话记录</button><div id="chat-history-list" role="log" aria-label="问答历史，可滚动" tabindex="0"></div></section><label class="sr-only" for="quick-input">对话或命令</label><textarea id="quick-input" maxlength="8000" rows="2" placeholder="聊点什么，或告诉我想做的事…"></textarea><div class="composer-bottom"><button id="quick-more" type="button" title="对话与服务设置" aria-label="对话与服务设置">＋</button><label class="sr-only" for="quick-mode">当前模式</label><select id="quick-mode" aria-label="当前模式"><option value="codex">智能对话 · Codex</option><option value="api">智能对话 · API</option><option value="local">本地指令</option><option value="search">浏览器搜索</option></select><span class="composer-spacer"></span><button id="quick-mic" type="button" title="点击录音，再次点击结束" aria-label="开始语音输入"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v3m-3 0h6"/></svg></button><button id="quick-send" type="submit" aria-label="发送" title="发送">↑</button><button id="quick-stop" type="button" hidden aria-label="停止回答" title="停止回答">■</button><button id="quick-close" type="button" hidden aria-label="移开焦点">×</button></div><div id="voice-status" role="status" hidden><span id="voice-label"></span><button id="voice-cancel" type="button">取消</button><button id="voice-stop-audio" type="button" hidden>停止播报</button></div><div id="reply-tools"><button id="quick-repeat" type="button" hidden title="重显上一条气泡">重显</button><button id="quick-answer" type="button" hidden title="查看完整回答">完整回答</button><button id="quick-copy" type="button" hidden title="复制上一条回复">复制</button><button id="quick-speak" type="button" hidden title="朗读上一条完整回复">朗读</button></div></form></div>
      <section id="telemetry" aria-label="系统信息" hidden>
        <button id="system-toggle" type="button" aria-expanded="false" aria-controls="system-details"><span id="system-summary"></span><svg class="card-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <div id="system-details" inert><div id="system-metrics"></div></div>
        <span id="quota-line" class="sr-only" hidden></span><span id="network-line" class="sr-only" hidden></span><span id="hardware-line" class="sr-only" hidden></span>
      </section>
    </div>
<section hidden id="radial" aria-label="环绕快捷控制"><svg class="connections" viewBox="0 0 760 650" aria-hidden="true"><circle cx="380" cy="325" r="90"/><path d="M380 325 200 155M380 325 560 155M380 325 145 325M380 325 615 325M380 325 200 495M380 325 560 495"/></svg><div class="hub surface"><span class="hub-mark" aria-hidden="true">✦</span><strong>快捷控制</strong><button id="close" aria-label="关闭快捷控制">×</button></div>
<section class="surface node wifi"><header><span class="icon" data-icon="wifi"></span><h2><button class="detail-trigger" data-choices="wifi">Wi-Fi <span>展开 ›</span></button></h2><button data-settings="wifi" aria-label="打开 Wi-Fi 设置">↗</button></header><p id="wifi-state">读取无线状态…</p><button class="switch" role="switch" aria-checked="false" id="wifi-toggle" disabled><i></i><span>切换</span></button></section>
<section class="surface node bluetooth"><header><span class="icon" data-icon="bluetooth"></span><h2><button class="detail-trigger" data-choices="bluetooth">蓝牙 <span>展开 ›</span></button></h2><button data-settings="bluetooth" aria-label="打开蓝牙设置">↗</button></header><p id="bluetooth-state">读取设备状态…</p><button class="switch" role="switch" aria-checked="false" id="bluetooth-toggle" disabled><i></i><span>切换</span></button></section>
<section class="surface node volume"><header><span class="icon" data-icon="volume"></span><h2>主音量</h2><output id="volume-value">—</output></header><label class="sr-only" for="volume">主音量</label><input id="volume" type="range" min="0" max="100" disabled><p id="volume-state">读取当前音量…</p><button id="volume-undo" class="subtle">撤销音量</button></section>
<section class="surface node brightness"><header><span class="icon" data-icon="sun"></span><h2>亮度</h2><output id="brightness-value">—</output><button data-settings="brightness" aria-label="打开显示设置">↗</button></header><label class="sr-only" for="brightness">屏幕亮度</label><input id="brightness" type="range" min="0" max="100" disabled><p id="brightness-state">检测显示器…</p></section>
<section class="surface node apps"><header><span class="icon" data-icon="grid"></span><h2>我的快捷方式</h2><button id="configure" aria-label="配置快捷方式">＋</button></header><div id="launches"><p>读取已配置目标…</p></div></section>
<section class="surface node battery"><header><span class="icon" data-icon="battery"></span><h2><button class="detail-trigger" data-choices="power">电池与电源 <span>展开 ›</span></button></h2><button data-settings="battery" aria-label="打开电源设置">↗</button></header><strong id="battery-value">—</strong><progress id="battery-level" max="100" value="0" aria-label="电池电量" hidden></progress><p id="battery-state">读取电源状态…</p></section>
<div id="metric-orbit"></div><nav id="metric-pages" hidden><button id="metric-prev" aria-label="上一页系统指标">‹</button><span id="metric-page-label"></span><button id="metric-next" aria-label="下一页系统指标">›</button></nav><section class="surface choice-panel" id="choices" hidden><header><button id="choice-back" aria-label="返回环绕快捷面板">‹ 返回</button><h2 id="choice-title">设备选择</h2><button id="choice-refresh" aria-label="刷新列表">↻</button></header><p id="choice-reason" role="status"></p><div id="choice-list"></div><button id="choice-system">Windows 设置</button></section><aside id="feedback" class="surface" role="status" hidden></aside><button id="refresh" class="surface">刷新状态</button></section>
  </main>
  <script src="../replica/geometry-data.js"></script>
  <script src="../replica/src/math.js"></script>
  <script src="../replica/src/tables.js"></script>
  <script src="../replica/src/pose.js"></script>
  <script src="../replica/src/tricks.js"></script>
  <script src="../replica/src/fx.js"></script>
  <script src="../replica/src/eyes.js"></script>
  <script src="../replica/src/character.js"></script>
  <script src="hud-model.js"></script><script src="hud-card.js"></script><script src="cult-toolbar.js"></script><script src="voice-controller.js"></script><script src="chat-history.js"></script><script src="pet.js"></script><script src="radial.js"></script><script src="dock-ui.js"></script>
<script src="arc-controls.js"></script></body>
</html>
