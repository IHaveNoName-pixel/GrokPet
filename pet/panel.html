<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'"><title>桌宠状态 · Codex 与网络</title><link rel="stylesheet" href="panel.css"></head>
<body><header><span class="eyebrow">BLOB COMPANION</span><h1>陪你工作的小助手</h1><p>Codex 额度、网络状态和消息提醒</p></header>
<main><section><div class="section-title"><h2>Codex 额度</h2><button id="refresh">刷新</button></div><div id="quota">正在连接 Codex…</div><p id="quota-time" class="muted"></p><p id="activity">等待工作状态</p><button id="hooks">接入 Codex 工作状态</button><p class="muted">通过官方 hooks 接收事件，不干预审批。接入后在新聊天或重新打开 Codex 后生效。</p></section>
<section><h2>网络</h2><div class="speeds"><div><span>下载</span><strong id="download">—</strong></div><div><span>上传</span><strong id="upload">—</strong></div></div><p id="adapter" class="muted">等待物理网卡数据</p><div class="line"><span>系统代理</span><b id="proxy">未知</b></div><div class="line"><span>VPN / TUN</span><b id="vpn">未知</b></div><p class="muted">网卡/代理状态不代表目标网站可达；这里只显示状态。</p></section>
<section><h2>系统负载</h2><div class="hardware-grid"><div><span>CPU</span><strong id="cpu">—</strong></div><div><span>内存</span><strong id="memory">—</strong></div><div><span>GPU</span><strong id="gpu">—</strong></div></div><p id="memory-detail" class="muted"></p><p id="gpu-detail" class="muted"></p><p id="hardware-hint" class="muted">正在采样</p></section>
<section><h2>消息气泡</h2><p>Windows 通知：<b id="notification">未启用</b></p><div class="actions"><button id="notifications-on">启用 Windows 通知</button><button id="notifications-off">停止读取</button><button id="test-notice">测试气泡</button></div><p class="muted">仅转发启用后新到达的系统通知。消息留在本机；不会补播历史消息。未发出 Windows 通知的应用消息无法接收。</p></section><p id="feedback" role="status"></p></main><script src="panel.js"></script></body></html>
